[workspace]
resolver = "2"
members = ["crates/tig-core", "crates/tig-private", "crates/tig-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
tig-core = { path = "crates/tig-core" }
tig-private = { path = "crates/tig-private" }
blake3 = "1"
lz4_flex = "0.11"
getrandom = "0.2"
thiserror = "1"
hex = "0.4"
regex = "1"
unicode-normalization = "0.1"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
zeroize = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
similar = "2"
proptest = "1"
tempfile = "3"
gix = { version = "0.89", default-features = false, features = ["sha1", "sha256"] }

[profile.release]
# Shipped binaries carry no debug info: smaller to load and to scan.
strip = "debuginfo"

# `cargo build --profile profiling` keeps line tables for profilers.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
