[workspace]
resolver = "2"
members = ["crates/tig-core", "crates/tig-private", "crates/tig-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
tig-core = { path = "crates/tig-core" }
tig-private = { path = "crates/tig-private" }
blake3 = "1"
lz4_flex = "0.11"
getrandom = "0.2"
thiserror = "1"
hex = "0.4"
regex = "1"
unicode-normalization = "0.1"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"
tempfile = "3"

[profile.release]
debug = 1
